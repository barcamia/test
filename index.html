<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingenious One</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ease-luxe: cubic-bezier(0.45, 0, 0.15, 1);
      --c-bg: #0c1628;
      --c-text: #f2ede6;
      --c-muted: rgba(242,237,230,0.65);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--c-bg);
      color: var(--c-text);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── SVG mask defs ─────────────────────────────────────────── */
    #svg-defs {
      position: absolute;
      width: 0; height: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* ── Preloader ─────────────────────────────────────────────── */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--c-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .loader-ring {
      width: 32px; height: 32px;
      border: 1.5px solid rgba(242,237,230,0.15);
      border-top-color: rgba(242,237,230,0.6);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Hero ───────────────────────────────────────────────────── */
    #hero {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }

    /* Background wrapper — this is what gets blob-masked */
    #hero-bg-wrapper {
      position: absolute;
      inset: 0;
      will-change: transform, opacity, filter;
      /* mask applied via JS for reliability */
    }

    #hero-bg {
      position: absolute;
      inset: -4%;          /* slight overflow so scale anim doesn't show edges */
      background:
        radial-gradient(ellipse 55% 45% at 65% 28%, #1d4580 0%, transparent 65%),
        radial-gradient(ellipse 35% 30% at 18% 22%, #253f7a 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 50% 80%, #0a1525 0%, transparent 70%),
        linear-gradient(168deg, #0f2050 0%, #1a3d8f 40%, #2255b0 65%, #0d1e4a 100%);
      will-change: transform, filter, opacity;
      transform-origin: center center;
    }

    /* Daisy flowers (SVG, positioned at bottom of bg) */
    #hero-flowers {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 72%;
      pointer-events: none;
    }

    /* Subtle vignette */
    #hero-bg-wrapper::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 90% at 50% 50%, transparent 40%, rgba(8,14,28,0.55) 100%);
      pointer-events: none;
    }

    /* Cloud wisps */
    .cloud {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      filter: blur(40px);
      pointer-events: none;
    }
    .cloud-1 { width: 340px; height: 120px; top: 18%; left: 52%; }
    .cloud-2 { width: 220px; height: 90px;  top: 24%; left: 30%; }
    .cloud-3 { width: 180px; height: 70px;  top: 10%; left: 70%; }

    /* ── Overlay: nav + text (NOT masked) ────────────────────────── */
    #hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    /* Navigation */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 48px;
      backdrop-filter: blur(0px);
    }

    @media (max-width: 600px) {
      nav { padding: 18px 24px; }
    }

    .nav-logo {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--c-text);
      opacity: 0.9;
      will-change: transform, opacity;
    }

    .nav-links {
      display: flex;
      gap: 36px;
      list-style: none;
    }

    @media (max-width: 600px) { .nav-links { display: none; } }

    .nav-links a {
      color: var(--c-muted);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.06em;
      transition: color 0.25s;
      will-change: transform, opacity;
    }
    .nav-links a:hover { color: var(--c-text); }

    .nav-cta {
      border: 1px solid rgba(242,237,230,0.35);
      background: rgba(242,237,230,0.07);
      color: var(--c-text);
      padding: 9px 20px;
      border-radius: 3px;
      font-size: 11.5px;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.25s, border-color 0.25s;
      will-change: transform, opacity;
    }
    .nav-cta:hover { background: rgba(242,237,230,0.14); border-color: rgba(242,237,230,0.55); }

    /* Hero text */
    .hero-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 48px 80px;
      max-width: 680px;
    }

    @media (max-width: 600px) {
      .hero-content { padding: 0 24px 60px; }
    }

    .hero-eyebrow {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--c-muted);
      margin-bottom: 20px;
      will-change: transform, opacity;
    }

    .hero-headline {
      font-family: Georgia, 'Times New Roman', 'Book Antiqua', serif;
      font-size: clamp(38px, 5.5vw, 68px);
      font-weight: 400;
      line-height: 1.12;
      color: var(--c-text);
      letter-spacing: -0.01em;
      margin-bottom: 22px;
      will-change: transform, opacity;
    }

    .hero-headline em {
      font-style: italic;
      font-weight: 300;
      color: rgba(242,237,230,0.82);
    }

    .hero-description {
      font-size: 14px;
      line-height: 1.7;
      color: var(--c-muted);
      max-width: 420px;
      margin-bottom: 36px;
      letter-spacing: 0.01em;
      will-change: transform, opacity;
    }

    .hero-cta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      will-change: transform, opacity;
    }

    .btn {
      padding: 13px 28px;
      border-radius: 3px;
      font-size: 12px;
      letter-spacing: 0.09em;
      cursor: pointer;
      transition: all 0.25s;
    }

    .btn-primary {
      background: rgba(242,237,230,0.12);
      border: 1px solid rgba(242,237,230,0.28);
      color: var(--c-text);
    }
    .btn-primary:hover { background: rgba(242,237,230,0.2); }

    .btn-ghost {
      background: transparent;
      border: 1px solid rgba(242,237,230,0.22);
      color: var(--c-muted);
    }
    .btn-ghost:hover { border-color: rgba(242,237,230,0.45); color: var(--c-text); }

    /* ── Reduced motion ─────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      #preloader { display: none; }
      #hero-bg-wrapper { -webkit-mask: none !important; mask: none !important; }
      #hero-bg { transform: none !important; filter: none !important; opacity: 1 !important; }
      .anim-el { transform: none !important; opacity: 1 !important; }
      .loader-ring { animation: none; }
    }
  </style>
</head>
<body>

<!-- ── SVG mask & filter definitions ──────────────────────────────────── -->
<svg id="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!--
      Blob filter: turbulence displaces the circle for organic edges,
      then Gaussian blur feathers those edges for the atmospheric reveal.
    -->
    <filter id="blob-filter" x="-40%" y="-40%" width="180%" height="180%"
            color-interpolation-filters="linearRGB">

      <!-- Organic turbulence noise -->
      <feTurbulence
        id="ft-noise"
        type="turbulence"
        baseFrequency="0.016 0.011"
        numOctaves="3"
        seed="14"
        result="noise"
      />

      <!-- Displace circle edges with noise → organic blob shape -->
      <feDisplacementMap
        id="ft-displace"
        in="SourceGraphic"
        in2="noise"
        scale="72"
        xChannelSelector="R"
        yChannelSelector="G"
        result="displaced"
      />

      <!-- Blur the displaced result → soft atmospheric feathering -->
      <feGaussianBlur
        id="ft-blur"
        in="displaced"
        stdDeviation="26"
        result="soft"
      />

    </filter>

    <!--
      The mask: a white circle (with blob filter) that grows from r=0.
      The hero bg is only visible through this white region.
    -->
    <mask id="reveal-mask" maskUnits="userSpaceOnUse">
      <rect id="mask-bg" x="0" y="0" width="100%" height="100%" fill="black"/>
      <circle
        id="reveal-circle"
        cx="0" cy="0" r="0"
        fill="white"
        filter="url(#blob-filter)"
      />
    </mask>

  </defs>
</svg>

<!-- ── Preloader ──────────────────────────────────────────────────────── -->

        the intersection of craft, clarity, and quiet ambition.
      </p>
      <div class="hero-cta anim-el" data-delay="8">
        <button class="btn btn-primary">See Works</button>
        <button class="btn btn-ghost">Book A Call</button>
      </div>
    </div>
  </div>

</section>

<script>
(function () {

  /* ─────────────────────────────────────────────────────────────────
     Minimal self-contained tween engine — no CDN dependency.
     Supports: opacity, transform (scale/translateY), filter (blur),
               SVG attr (r, scale, stdDeviation), callbacks, stagger.
  ───────────────────────────────────────────────────────────────── */

  // Easing functions
  const ease = {
    luxe:    t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2,   // power2.inOut
    out3:    t => 1 - Math.pow(1-t, 3),                              // power3.out
    out1:    t => 1 - (1-t),                                         // linear
    inOut1:  t => t < 0.5 ? 2*t*t : -1+(4-2*t)*t,                  // power1.inOut
    in2:     t => t*t,                                               // power2.in
  };

  /* tween(target, props, durationMs, easeFn, delayMs, onComplete)
     props keys: opacity | translateY | scale | blur | svgR | svgDisplace | svgBlur */
  function tween(target, props, dur, easeFn, delay, onDone) {
    if (!target) return;
    const els = Array.isArray(target) ? target : [target];

    // Read start values
    els.forEach(el => {
      if (el._tweenStart) return;
      const cs = getComputedStyle(el);
      el._tweenStart = {
        opacity:     parseFloat(cs.opacity) || 0,
        translateY:  el._ty  || 0,
        scale:       el._sc  || 1,
        blur:        el._bl  || 0,
      };
    });

    const start = performance.now() + (delay || 0);

    function frame(now) {
      if (now < start) { requestAnimationFrame(frame); return; }
      const raw = Math.min((now - start) / dur, 1);
      const t   = easeFn(raw);

      els.forEach(el => {
        const s = el._tweenStart || {};
        if ('opacity' in props) {
          const v = s.opacity + (props.opacity - s.opacity) * t;
          el.style.opacity = v;
        }
        if ('translateY' in props || 'scale' in props) {
          const ty = ('translateY' in props)
            ? (s.translateY + (props.translateY - s.translateY) * t) : (el._ty || 0);
          const sc = ('scale' in props)
            ? (s.scale + (props.scale - s.scale) * t) : (el._sc || 1);
          el.style.transform = `translateY(${ty}px) scale(${sc})`;
          el._ty = ty; el._sc = sc;
        }
        if ('blur' in props) {
          const v = s.blur + (props.blur - s.blur) * t;
          el.style.filter = `blur(${v}px)`;
          el._bl = v;
        }
        if ('svgR' in props) {
          const v = (s.svgR||0) + (props.svgR - (s.svgR||0)) * t;
          el.setAttribute('r', v);
        }
        if ('svgDisplace' in props) {
          const v = (s.svgDisplace||72) + (props.svgDisplace - (s.svgDisplace||72)) * t;
          el.setAttribute('scale', v);
        }
        if ('svgBlur' in props) {
          const v = (s.svgBlur||26) + (props.svgBlur - (s.svgBlur||26)) * t;
          el.setAttribute('stdDeviation', v);
        }
      });

      if (raw < 1) requestAnimationFrame(frame);
      else if (onDone) onDone();
    }

    requestAnimationFrame(frame);
  }

  // Stagger helper
  function stagger(els, props, dur, easeFn, startDelay, staggerMs) {
    els.forEach((el, i) => {
      el._tweenStart = null; // reset so start is read fresh
      tween(el, props, dur, easeFn, startDelay + i * staggerMs);
    });
  }

  /* ── Respect prefers-reduced-motion ── */
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── Viewport ── */
  const W  = window.innerWidth;
  const H  = window.innerHeight;
  const cx = W * 0.5;
  const cy = H * 0.48;
  const maxR = Math.sqrt(
    Math.max(cx, W-cx)**2 + Math.max(cy, H-cy)**2
  ) * 1.22;

  /* ── SVG mask setup ── */
  const svgDefs    = document.getElementById('svg-defs');
  const maskBg     = document.getElementById('mask-bg');
  const revealCirc = document.getElementById('reveal-circle');
  const ftDisplace = document.getElementById('ft-displace');
  const ftBlur     = document.getElementById('ft-blur');
  svgDefs.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svgDefs.setAttribute('width', W);
  svgDefs.setAttribute('height', H);
  maskBg.setAttribute('width', W);
  maskBg.setAttribute('height', H);
  revealCirc.setAttribute('cx', cx);
  revealCirc.setAttribute('cy', cy);

  const bgWrapper = document.getElementById('hero-bg-wrapper');
  const heroBg    = document.getElementById('hero-bg');
  const preloader = document.getElementById('preloader');

  const animEls = Array.from(document.querySelectorAll('.anim-el'))
    .sort((a, b) => +a.dataset.delay - +b.dataset.delay);

  /* ── Show everything instantly (reduced motion or already played) ── */
  function showInstant() {
    preloader.style.display = 'none';
    bgWrapper.style.webkitMask = 'none';
    bgWrapper.style.mask = 'none';
    heroBg.style.transform = 'scale(1)';
    heroBg.style.opacity   = '1';
    heroBg.style.filter    = 'blur(0px)';
    animEls.forEach(el => {
      el.style.opacity   = '1';
      el.style.transform = 'translateY(0px) scale(1)';
    });
  }

  const PLAYED_KEY = 'hero_intro_played';

  if (reduced || sessionStorage.getItem(PLAYED_KEY)) {
    showInstant();
    return;
  }

  /* ── Set initial states ── */
  heroBg.style.transformOrigin = 'center center';
  heroBg.style.willChange      = 'transform, opacity, filter';
  heroBg._sc = 1.08; heroBg._bl = 16;
  heroBg.style.transform = 'translateY(0px) scale(1.08)';
  heroBg.style.opacity   = '0';
  heroBg.style.filter    = 'blur(16px)';

  animEls.forEach(el => {
    el._ty = 30; el._sc = 1;
    el.style.transform = 'translateY(30px) scale(1)';
    el.style.opacity   = '0';
    el.style.willChange = 'transform, opacity';
  });

  /* ── Apply SVG mask ── */
  bgWrapper.style.webkitMask = 'url(#reveal-mask)';
  bgWrapper.style.mask       = 'url(#reveal-mask)';

  /* ── Timeline constants ── */
  const TOTAL_MS  = 1900;  // blob expand
  const STAGGER_OFFSET_MS = TOTAL_MS * 0.30; // UI starts at 30% of blob

  /* ── Run animation ── */

  // Fade preloader out
  preloader.style.opacity = '1';
  preloader._tweenStart = { opacity: 1 };
  tween(preloader, { opacity: 0 }, 500, ease.out1, 0, () => {
    preloader.style.display = 'none';
  });

  // Blob grows
  revealCirc._tweenStart = { svgR: 0 };
  tween(revealCirc, { svgR: maxR }, TOTAL_MS, ease.luxe, 0);

  // Turbulence settles
  ftDisplace._tweenStart = { svgDisplace: 72 };
  tween(ftDisplace, { svgDisplace: 22 }, TOTAL_MS, ease.inOut1, 0);

  // Edge blur tightens
  ftBlur._tweenStart = { svgBlur: 26 };
  tween(ftBlur, { svgBlur: 14 }, TOTAL_MS, ease.in2, 0);

  // Hero bg: scale in, unblur, fade
  heroBg._tweenStart = { scale: 1.08, blur: 16, opacity: 0, translateY: 0 };
  tween(heroBg, { scale: 1, blur: 0, opacity: 1, translateY: 0 }, TOTAL_MS, ease.luxe, 0,
    () => {
      // Remove mask once fully revealed
      bgWrapper.style.webkitMask = 'none';
      bgWrapper.style.mask       = 'none';
      sessionStorage.setItem(PLAYED_KEY, '1');
    }
  );

  // UI elements stagger in
  animEls.forEach(el => { el._tweenStart = null; });
  stagger(
    animEls,
    { translateY: 0, opacity: 1 },
    850, ease.out3,
    STAGGER_OFFSET_MS, 80
  );

})();
</script>
</body>
</html>
