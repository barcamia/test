<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sketch to Life</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Georgia', serif;
      background: #fff;
    }

    /* ── Scene container ── */
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ── SKETCH LAYER (visible at start) ── */
    .layer-sketch {
      position: absolute; inset: 0;
      background: #fafafa;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .layer-sketch svg.flowers {
      width: 100%;
      height: 80%;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    /* ── PHOTO LAYER (revealed by blob clip) ── */
    .layer-photo {
      position: absolute; inset: 0;
      /* Deep blue sky photo simulation */
      background:
        radial-gradient(ellipse 60% 40% at 70% 30%, #c8dff5 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 20% 20%, #d4e8f7 0%, transparent 55%),
        linear-gradient(175deg, #1a3a6b 0%, #2155a3 35%, #3370c4 60%, #1e3d7a 100%);
      clip-path: url(#blob-clip);
    }

    /* Flowers photo texture overlay */
    .layer-photo::after {
      content: '';
      position: absolute; inset: 0;
      background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>") center/cover;
      opacity: 0.15;
    }

    /* Daisy flowers in color */
    .layer-photo .flowers-color {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 75%;
    }

    /* ── BLOB SVG CLIP-PATH ── */
    #clip-svg {
      position: absolute;
      width: 0; height: 0;
      overflow: hidden;
    }

    /* ── WEBSITE UI (fades in at end) ── */
    .layer-ui {
      position: absolute; inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease 0.3s;
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }
    .layer-ui.visible {
      opacity: 1;
      pointer-events: auto;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
    }
    .nav-logo {
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }
    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }
    .nav-links a {
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.04em;
    }
    .nav-cta {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 8px 18px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .hero-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 40px;
      max-width: 560px;
      margin-left: 40px;
    }
    .hero-text h1 {
      font-size: clamp(32px, 4vw, 52px);
      color: #fff;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 12px;
    }
    .hero-text h1 em {
      font-style: italic;
      font-weight: 300;
    }
    .hero-text p {
      color: rgba(255,255,255,0.75);
      font-size: 14px;
      margin-bottom: 28px;
      font-family: sans-serif;
      letter-spacing: 0.02em;
    }
    .hero-btns {
      display: flex;
      gap: 12px;
    }
    .btn-outline {
      border: 1px solid rgba(255,255,255,0.5);
      color: #fff;
      background: transparent;
      padding: 10px 22px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-family: sans-serif;
    }
    .btn-solid {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 10px 22px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-family: sans-serif;
      backdrop-filter: blur(6px);
    }

    /* ── CROSS-STITCH / TEXTURE overlay on photo ── */
    .texture-overlay {
      position: absolute; inset: 0;
      pointer-events: none;
      clip-path: url(#blob-clip);
    }
    .texture-overlay canvas {
      width: 100%; height: 100%;
    }
  </style>
</head>

<script>
// ── Organic blob morph animation ──────────────────────────────────────────────

const W = window.innerWidth;
const H = window.innerHeight;

// Origin point (center-right area where blob starts in original video)
const OX = W * 0.58;
const OY = H * 0.38;

// Blob shape: defined by N control points on a roughly circular path
// Each point has a base radius and a "noise" offset for organic look
const N = 18; // number of control points

// Pre-generate random bumps for each control point
const bumps = Array.from({length: N}, (_, i) => ({
  base: 1.0,
  noise: (Math.random() - 0.5) * 0.4,
  noise2: (Math.random() - 0.5) * 0.25,
}));

function blobPath(cx, cy, r, t) {
  // t = 0..1 animation progress (controls size)
  // Returns an SVG path string for the blob in screen coords
  const points = [];
  for (let i = 0; i < N; i++) {
    const angle = (i / N) * Math.PI * 2 - Math.PI / 2;
    const b = bumps[i];
    // Organic wobble that evolves slightly with time
    const wobble = b.base + b.noise * Math.sin(t * 3 + i * 1.2) + b.noise2 * Math.cos(t * 5 + i * 0.9);
    // Stretch horizontally to match the video's wider ink spread
    const rx = r * wobble * 1.35;
    const ry = r * wobble * 0.88;
    const px = cx + Math.cos(angle) * rx;
    const py = cy + Math.sin(angle) * ry;
    points.push([px, py]);
  }

  // Build smooth bezier path through points
  const path = [];
  for (let i = 0; i < N; i++) {
    const prev = points[(i - 1 + N) % N];
    const curr = points[i];
    const next = points[(i + 1) % N];
    const nextNext = points[(i + 2) % N];

    if (i === 0) path.push(`M ${curr[0]},${curr[1]}`);

    // Catmull-Rom to cubic bezier
    const cp1x = curr[0] + (next[0] - prev[0]) / 6;
    const cp1y = curr[1] + (next[1] - prev[1]) / 6;
    const cp2x = next[0] - (nextNext[0] - curr[0]) / 6;
    const cp2y = next[1] - (nextNext[1] - curr[1]) / 6;
    path.push(`C ${cp1x},${cp1y} ${cp2x},${cp2y} ${next[0]},${next[1]}`);
  }
  path.push('Z');

  // When large enough, also add a full-coverage rect so clip covers edges
  if (r > Math.max(W, H) * 0.9) {
    path.push(`M -100,-100 L ${W+100},-100 L ${W+100},${H+100} L -100,${H+100} Z`);
  }

  return path.join(' ');
}

const blobPathEl = document.getElementById('blob-path');
const photoLayer = document.getElementById('photoLayer');
const uiLayer = document.getElementById('uiLayer');
const sketchLayer = document.getElementById('sketchLayer');

// Update clip-path SVG viewBox to match screen
const clipSvg = document.getElementById('clip-svg');

// Animation timeline
// Phase 1: 0.0 - 0.5s  → nothing (sketch visible, tiny dot appears)
// Phase 2: 0.5 - 2.5s  → blob grows from dot to full screen
// Phase 3: 2.5 - 3.5s  → UI fades in

const DELAY     = 0.7;  // seconds before blob starts growing
const GROW_DUR  = 1.9;  // seconds for blob to fill screen
const UI_DELAY  = 2.4;  // seconds before UI appears

// Max radius to cover entire screen from origin
const MAX_R = Math.sqrt(
  Math.max(OX, W - OX) ** 2 + Math.max(OY, H - OY) ** 2
) * 1.15;

let startTime = null;
let uiShown = false;

function easeInOut(t) {
  // Smooth cubic ease in-out, faster in middle
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function animate(ts) {
  if (!startTime) startTime = ts;
  const elapsed = (ts - startTime) / 1000; // seconds

  // Blob growth
  const growProgress = Math.min(1, Math.max(0, (elapsed - DELAY) / GROW_DUR));
  const easedProgress = easeInOut(growProgress);
  const currentR = easedProgress * MAX_R;

  if (currentR > 0.5) {
    const path = blobPath(OX, OY, currentR, elapsed);
    blobPathEl.setAttribute('d', path);
  }

  // Fade out sketch as blob grows (starts fading at 60% coverage)
  if (growProgress > 0.5) {
    const fadeT = (growProgress - 0.5) / 0.5;
    sketchLayer.style.opacity = 1 - fadeT;
  }

  // Show UI
  if (elapsed >= UI_DELAY && !uiShown) {
    uiShown = true;
    uiLayer.classList.add('visible');
  }

  if (growProgress < 1 || !uiShown) {
    requestAnimationFrame(animate);
  }
}

// Start after a brief pause so user sees the sketch
setTimeout(() => requestAnimationFrame(animate), 600);

// Replay on click
document.addEventListener('click', () => {
  if (!uiLayer.classList.contains('visible')) return;
  // Reset
  startTime = null;
  uiShown = false;
  uiLayer.classList.remove('visible');
  sketchLayer.style.opacity = '1';
  blobPathEl.setAttribute('d', 'M0,0');
  setTimeout(() => requestAnimationFrame(animate), 400);
});
</script>
